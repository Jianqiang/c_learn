[project]
name = "learning-os"
version = "0.1.0"
description = "Personal Learning OS v1 - local-first, concept-centric learning workbench"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "sympy>=1.12",
    "pint>=0.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
learn = "learning_os.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
