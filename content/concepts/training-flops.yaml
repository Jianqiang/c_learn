concept:
  slug: training-flops
  module_slug: llm-systems
  name: "Training FLOPs estimation (C ≈ 6ND)"
  importance: core
  description: >
    用 Kaplan/Chinchilla 简化公式 C ≈ 6 * N * D（N=参数量，D=训练 token
    数）估算训练所需 FLOPs 的数量级，并能对 dense 与 MoE（active vs total
    parameters）模型分别套用。
  research_relevance: >
    训练 FLOPs 数量级是判断"这家公司/这次训练的算力叙事是否自洽"的最基本
    的确定性检查工具，属于模块 D（AI 技术经济学）的前置计算能力。
sources:
  - a5-math-refresh-graduation-assignment
