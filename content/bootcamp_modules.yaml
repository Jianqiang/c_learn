# Deliberate Practice Bootcamp v3 — "Build the Map" (knowledge-first) → Phase B "Build the Skill" (live investing)
#
# 9 module（M0, PatchA, M1-M7），知识优先：每个 module = 材料 + 一个轻量 micro exercise/quiz。
# 不设逐 module 闭卷出口或强制预测配额——那些检验挪到 Phase A 结束后的 Phase B（真实候选 underwriting）。
# 2026-09-15：补 8 个 CEI gap 中最有增量的四块——Customer Economics / Competitive Response /
# Duration / Discriminating Evidence，另两个 gap（Ownership Bridge、Joint Scenario）以 exercise
# 形式并入 M3/M7，不单独开课。

bootcamp:
  slug: deliberate-practice-bootcamp-v3
  name: "Deliberate Practice Bootcamp v3: Build the Map → Build the Skill"
  version: "2026-09-15-v3.1"
  mode: module
  start_date: "2026-09-07"
  timezone: "Asia/Shanghai"
  daily_hours: 5
  total_budget_hours: 88

  core_loop:
    - Theory
    - Retrieval
    - Micro-exercise
    - Update Master Map

  final_chain:
    - Technology Change
    - Customer Economics
    - Demand
    - Supply/Competition
    - Architecture/Rent
    - Duration
    - Financials/ROIIC/FCF
    - Capital Allocation
    - Per-Share Value
    - Market Expectations
    - Variant
    - Evidence
    - Scenario
    - Position
    - Update

  graduation_questions:
    note: "Phase A 的考试大纲不是「读完了多少」，是能否对一个陌生 fundamental opportunity 快速回答以下 18 问。"
    items:
      - "What changed?"
      - "Why does the customer care?"
      - "What happens to demand?"
      - "How does supply/competition respond?"
      - "What architecture/bottleneck controls value?"
      - "Who captures rent?"
      - "How long can it last?"
      - "How does it enter financials?"
      - "What is ROIIC/reinvestment?"
      - "How does enterprise value reach per-share value?"
      - "What does price imply?"
      - "Could price be wrong about discount rates, not cashflows?"
      - "What exactly is my variant?"
      - "What evidence discriminates my model?"
      - "What are coherent causal scenarios?"
      - "How exactly do I realize return?"
      - "How much should I own?"
      - "What would change my mind?"

  design_principles:
    - id: p1
      name: "AI 永远晚于你的第一次 attempt"
      rule: "Human prior → AI evidence → Human update。micro exercise 提交前不给结论、不给 thesis。"
    - id: p2
      name: "75-80% Knowledge + 20-25% Retrieval/Quiz/Micro Exercise"
      rule: "module 内自行把握比例，不脚本强制。"
    - id: p3
      name: "Phase A 不设闭卷出口，检验留给 Phase B"
      rule: "真正的下注/迁移检验在 Phase B：真实候选的完整 underwriting 与 live position 决策。"
    - id: p4
      name: "终点是 skill diagnosis"
      rule: "Phase A 产出知识地图；Phase B 才回答「我已 proceduralize 什么 / 哪里仍依赖 AI」。"

  gates:
    - id: g1
      name: "材料占比参考线"
      rule: "材料消化时间宜 ≤ module 总时间 50%，owner 自行把握，不脚本强制拦截。"
    - id: g3
      name: "Phase A 毕业 ≥10 条可结算预测"
      rule: "集中在 M7 产出，须通过 forecast linter（指标/阈值/时间窗/resolution source 齐全）。"

  trainers:
    primary:
      slug: ai-rent-universe
      name: "AI rent universe"
      role: "主应用场 —— owner 有 edge，且通向真实下注"
      members:
        - {ticker: "AVGO", note: "upstream CS 教科书案例"}
        - {ticker: "NVDA", note: "specialized + category-level CS"}
        - {ticker: "PLTR", note: "downstream CS，rent 已 consensus"}
        - {ticker: "NOW", note: "workflow CS，rent 已 consensus"}
        - {ticker: "CRM", note: "★ 最高研究价值：defensive feature vs 新 rent layer 未决"}
        - {ticker: "INTC", note: "custom silicon / packaging CS option"}
        - {ticker: "600588.SH", note: "用友：substrate → CS transition，architecture 已证 / rent 未证"}
        - {ticker: "600570.SH", note: "恒生：极强 specialized substrate，AI-CS 尚早"}
      unlisted_references:
        - "飞书（字节，未上市）—— 中国最强 work-state CS seed"
        - "WorkBuddy（腾讯）—— neutral harness，CS potential 在企业 state 侧"
    live_position:
      slug: tencent
      ticker: "0700.HK"
      name: "腾讯控股"
      role: "live position —— 同时是 AI rent universe 成员，深度案例"
      chain: "monetization → FCF → expectations → sizing"
      primary_source: "https://www.tencent.com/investors/financial-reports/"
    deferred:
      - slug: snps
        ticker: "SNPS"
        name: "Synopsys"
        role: "M2 锚点对象。清 SNPS GAAP OPM 13.0% vs non-GAAP 41.6% 的 28.6pt 差异。"
        primary_source: "https://investor.synopsys.com/financials/sec-filings/default.aspx"
        note: "本地已有 memo（08_SNPS_Synopsys）—— 闭卷完成前不得打开"

  local_resources:
    root: "/Users/jma/PycharmProjects/fin/co_investor"
    cninfo_announcements:
      path: "output/research_os/official_announcements/cninfo/"
      coverage: "48 只 A 股已抓取公告"
      usage: "M2/M4 需要具体报表数字时可用"
    existing_memos:
      path: "output/chatgpt_cases_archive/"
      count: 17
      covers: "锐捷网络 通富微电 安集科技 联瑞新材 上海新阳 华海诚科 天承科技 SNPS 腾讯 古茗 比亚迪 CRM NOW 三环集团 盛美上海 麦格米特 江丰电子"
      pit_usage_rule: >
        这 17 份 memo 是带时间戳的历史判断。用法必须是：先闭卷写出当前判断 → 再打开当时的 memo →
        对比「我当时怎么想 / 现在怎么想 / 什么证据让我改变」。顺序反了就退化成抄旧结论。
      affects_bootcamp:
        - "SNPS：M2 锚点，reconcile 前不得参考"
        - "CRM / NOW / 腾讯：M5 做 reverse DCF 前必须先闭卷，再对照 memo 做 PIT 比较"

  modules:
    - id: M0
      name: "Technology Change → Architecture → Rent"
      question: "Constraint 如何变成 Architecture，Architecture 为什么决定谁 capture value？"
      status: in_progress
      est_hours: "16"
      chain: "Constraint → Interdependency → Architecture → Bottleneck → Value Capture"
      materials:
        - ref: teece-1986
          title: "Teece — Profiting from Technological Innovation"
          status: done
          actual_hours: "2.5"
          url: "https://www.sciencedirect.com/science/article/pii/0048733386900272"
        - ref: brandenburger-stuart-1996
          title: "Brandenburger & Stuart — Value-Based Business Strategy"
          status: done
          url: "https://business.columbia.edu/faculty/research/value-based-business-strategy"
        - ref: baldwin-bottlenecks
          title: "Baldwin — Bottlenecks, Modules and Dynamic Architectural Capabilities"
          status: done
          scope: "technical bottleneck / strategic bottleneck / modular interface / control point"
          url: "https://www.hbs.edu/ris/download.aspx?name=15-028.pdf"
        - ref: jacobides-2006
          title: "Jacobides, Knudsen & Augier — Benefiting from Innovation"
          status: done
          scope: "industry architecture 如何决定 appropriation"
          url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1309509"
        - ref: henderson-clark-1990
          title: "Henderson & Clark 1990 — Architectural Innovation"
          status: done
          actual_hours: "4"
          scope: >
            补最大的推理缺口：从「这里有 bottleneck」跳到「所以这里 capture value」，
            缺少「architecture 为什么变、bottleneck 能维持多久」。owner 反馈：非常好的论文，
            边读边做了案例分析，收获大。
          url: "https://doi.org/10.2307/2393549"
          open_copy: "http://dspace.mit.edu/bitstream/handle/1721.1/48004/generationalinno00hend.pdf?sequence=1"
      jit_pool:
        rule: "触发条件出现才读，读完只写进当次 case 的 model update，不产出读书笔记。"
        items:
          - ref: jacobides-winter-2005
            title: "Jacobides & Winter 2005 — Co-evolution of Capabilities and Transaction Costs"
            trigger: "判断 firm boundary 变化（纵向专业化/解体）时"
          - ref: colfer-baldwin-2016
            title: "Colfer & Baldwin 2016 — The Mirroring Hypothesis"
            trigger: "IBM PC / NVIDIA case 里 technical architecture 与 organizational architecture 不一致时"
          - ref: adner-kapoor-2010
            title: "Adner & Kapoor 2010 — Value Creation in Innovation Ecosystems"
            trigger: "量化 upstream component 与 downstream complement 的不对称影响时"
          - ref: cohen-levinthal-1990
            title: "Cohen & Levinthal 1990 — Absorptive Capacity"
            trigger: "判断企业客户能否真正吸收 AI（capability ≠ adoption）时"
      done_so_far:
        - "Teece 三概念（appropriability regime / dominant design / complementary assets）"
        - "五关框架：Asset Specificity → Bilateral Dependence → Redeployability → Bargaining Power → Observed Rent"
        - "10 家公司 Teece 判断地图（outputs/day02/04_memo_teece_ai_rent.md）"
        - "Jacobides 2006 — Benefiting from Innovation"
        - "Henderson & Clark 1990 — Architectural Innovation（含边读边做的案例分析）"
      remaining:
        - "可选：如果读 Henderson & Clark 时做的案例分析已经覆盖了 component/architectural change/complement/bottleneck/control/bargaining rent 的区分，M0 材料+练习即算完成，不需要再补一个单独的 20-45min micro exercise；如果没有覆盖，才需要补做"
      exit_criteria:
        - "闭卷画出任一给定公司的 Innovation → Asset Specificity → Bilateral Dependence → Bargaining Power → Observed Rent"
        - "能区分 component innovation 与 architectural innovation，并说明后者为何让在位者失效"
        - "能回答「这个 bottleneck 能维持多久」，给出 modularization / standardization / integration 三条侵蚀路径"
      ai_usage:
        mode: "independent divergence + fact extraction，owner 提交 micro exercise 前不给结论"
        allowed: "事实三栏提取；micro exercise 提交后做 reconciler（只报概念混淆，不报答案）"
        forbidden: "在 owner 提交前给出 control point 结论"

      note_2026_09_11_pm: >
        IBM PC Guided Lab 01（分轮隐藏证据的重项目）按 v3「知识优先，不做重项目」的方向取消。
        brief 仍留档于 outputs/m1/lab01_ibm_pc/00_brief_and_round1.md，仅作历史参考，不再是待办项。

    - id: PatchA
      name: "Customer Economics"
      question: "客户为什么在乎？技术变好为什么不会自动变成 demand？"
      status: pending
      est_hours: "5-6"
      chain: "Customer Value → WTP/TCO/ROI → Adoption → Demand"
      rationale: "补 CEI 里最常见的推理跳跃：产品好 ≠ 客户愿意买。这是 2026-09-15 新增的 patch。"
      materials:
        - ref: mit-15818-pricing
          title: "MIT Sloan 15.818 Pricing（Catherine Tucker，选读 lecture notes）"
          status: pending
          est_hours: "1.5-2"
          scope: "Pricing Economic Value to the Customer / Measuring Customer Reactions to Prices / Pricing to Segment Customers；Pricing under Consumer Uncertainty 只 skim"
          url: "https://ocw.mit.edu/courses/15-818-pricing-spring-2010/resources/"
        - ref: mit-1401-demand
          title: "MIT 14.01 Principles of Microeconomics（Jonathan Gruber，选段：需求侧）"
          status: pending
          est_hours: "2-2.5"
          scope: "看 Lecture 1（Supply & Demand）+ Lecture 4（Demand Curves / Income-Substitution Effects）；Lecture 2-3（Preferences/Budget Constraints）只读 summary"
          url: "https://ocw.mit.edu/courses/14-01-principles-of-microeconomics-fall-2023/video_galleries/video-lectures/"
      anchor_tasks:
        - "选一个具体产品（GPU / coding agent / liquid cooling 任选）：写 Current Alternative 的 Customer Economics vs New Product 的 Customer Economics，回答 incremental customer value / TCO / ROI-payback / WTP / adoption friction / price↓30%后demand为什么变化（30-45min）"
      exit_criteria:
        - "能把「技术变好了」拆成 WTP/TCO/ROI/adoption friction 四个可观测量，而不是直接跳到 revenue 会增长"
      ai_usage:
        mode: "material digest + retrieval quiz"
        allowed: "对材料做要点摘要"
        forbidden: "替 owner 完成 customer economics 拆解练习"

    - id: M1
      name: "Financial Accounting"
      question: "会计怎样把商业事实变成三张表？"
      status: pending
      est_hours: "6-7"
      materials:
        - ref: damodaran-accounting
          title: "Damodaran — Accounting Online Class（全套）"
          status: pending
          est_hours: "5-6"
