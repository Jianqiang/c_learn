        - "MIT 14.01 Producer/Supply patch"
        - "MIT D-Lab Supply Chains 选读"
        - "MIT 14.271 IO 选 6 讲"
      exit_criteria:
        - "能预测竞争与资本反应，而非只外推需求"
        - "对任一高 rent case，能用 8 条 barrier 清单（scale/sunk cost/switching/learning/network/standards/capacity/vertical foreclosure）判断竞争侵蚀速度"
      ai_usage:
        mode: "material digest + retrieval quiz"
        allowed: "提取材料要点"
        forbidden: "替 owner 划 supply cycle 的 regime 或做竞争侵蚀速度判断"

