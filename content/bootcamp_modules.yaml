          url: "https://www.morganstanley.com/im/en-us/institutional-investor/insights/consilient-observer/measuring-the-moat.html"
      anchor_tasks:
        - "拿一家熟悉公司，画 Revenue → NOPAT → Invested Capital → Incremental ROIC → Reinvestment → FCF（不搭大模型，45min）"
        - "对同一家公司显式拆 Duration：D_D(需求) / D_A(architecture) / D_B(bottleneck-scarcity) / D_S(share) / D_R(ROIIC-rent) 五段，每段写清 fade mechanism 是什么"
      remaining:
        - "Penman 选读五个主题"
        - "Mauboussin & Callahan ROIC"
        - "Damodaran Valuation 选段"
        - "Mauboussin & Callahan CAP + Measuring the Moat（Duration patch）"
        - "45min micro exercise + Duration 拆分练习"
      exit_criteria:
        - "能闭卷画出 Revenue → FCF 的完整链条并标出每一步的驱动因子"
        - "能对任一给定公司显式拆出五段 Duration 并各给一个 fade mechanism"
      ai_usage:
        mode: "material digest + retrieval quiz"
        allowed: "提取原始报表数据；对材料做要点摘要"
        forbidden: "替 owner 完成 ROIC 拆解或 Duration 拆分练习"

    - id: M3
      name: "Management & Capital Allocation + Ownership Bridge"
      question: "FCF 赚到手之后，管理层怎样把它再配置成未来的 per-share value？Enterprise value 创造是否真的传导到 per-share？"
      status: pending
      est_hours: "3-3.5"
      materials:
        - ref: mauboussin-capital-allocation
          title: "Mauboussin & Callahan — Capital Allocation: Results, Analysis, and Assessment（2025 更新版）"
          status: pending
          est_hours: "1.5-2"
          scope: "capex / R&D / M&A / divestitures / dividends / buybacks / capital structure / incentives / 评价管理层 capital-allocation skill；核心目标 maximize long-term value per share，而非 maximize EPS"
          url: "https://www.morganstanley.com/im/publication/insights/articles/article_capitalallocation.pdf"
      anchor_tasks:
        - "找一个熟悉公司：过去五年 FCF 的 100 元到底去了哪里？再问 incremental dollar 最应该去哪里（30min）"
        - "★ Ownership Bridge（1-1.5h）：同一家公司过去五年，按 FCF → Capex/R&D → M&A → Debt → Dividend → Buyback → SBC/Issuance → Share Count 走一遍，回答 Enterprise Value Creation 是否真的传导到 Per-Share Value Creation；重点检查 buyback price 是否合理、SBC 是否吃掉 buyback、leverage 是否真正创造 equity value、M&A incremental return、dilution"
      exit_criteria:
        - "能闭卷说出六类资本配置去向（capex/R&D/M&A/divestiture/dividend/buyback）并各自的价值创造条件"
        - "能对任一公司完成一次 Ownership Bridge，明确指出 EV creation 与 per-share value creation 是否脱节、脱节在哪一环"
      ai_usage:
        mode: "material digest + retrieval quiz"
        allowed: "提取材料要点；提取 Ownership Bridge 所需的原始报表数字"
        forbidden: "替 owner 判断某公司的 capital allocation 质量或完成 Ownership Bridge 的判断部分"

