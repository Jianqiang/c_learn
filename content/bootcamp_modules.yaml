          url: "https://pages.stern.nyu.edu/~adamodar/New_Home_Page/webcastacctg.htm"
        - ref: mit-15511-patch
          title: "MIT Sloan 15.511 Financial Accounting（rigor patch，选读）"
          status: pending
          est_hours: "1"
          scope: "只打开 Damodaran 没充分展开的：Revenue Recognition / Inventory-COGS / Long-lived Assets-Depreciation / Statement of Cash Flows"
          url: "https://ocw.mit.edu/courses/15-511-financial-accounting-summer-2004/"
      remaining:
        - "Damodaran Accounting Online Class 全套 + post-class tests"
        - "MIT 15.511 selective notes（按 Damodaran 未覆盖的缺口挑）"
      exit_criteria:
        - "能闭卷说出一笔常见交易（收入确认/资本化/SBC）如何同时影响三张表"
      ai_usage:
        mode: "material digest + retrieval quiz"
        allowed: "对材料做要点摘要、出闭卷回忆题"
        forbidden: "替 owner 完成 post-class tests"

    - id: M2
      name: "Financial Statement → Business Economics → FCF → Duration"
      question: "会计事实如何变成 forecast、valuation，以及 rent 能维持多久？"
      status: pending
      est_hours: "10-11"
      materials:
        - ref: penman-fsa
          title: "Penman — Financial Statement Analysis and Security Valuation（选读）"
          status: pending
          est_hours: "5-6"
          scope: "viewing the business through financial statements / profitability analysis / growth·sustainable earnings / forecasting / accounting quality"
          url: "https://business.columbia.edu/faculty/research/financial-statement-analysis-and-security-valuation"
        - ref: mauboussin-roic
          title: "Mauboussin & Callahan — ROIC and the Investment Process"
