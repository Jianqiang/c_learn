# Seed application references (plan 5.3: "2 个真实 research/case
# application reference"). These give the vertical slice at least one
# evidence-backed application per domain so the M0 acceptance test
# (drill -> recall -> review -> apply -> retire, plan section 14) has a
# `learn apply` example to run end-to-end, and so ApplicationService's
# evidence gates (plan 6.4) have real data to check against instead of only
# test fixtures.
#
# Honesty note (2026-08-30 owner audit, corrected same day): these two
# entries were originally recorded as evidence_level=STRONG with free-text
# reference/note strings but no episode ID, no verifiable artifact path, and
# no reference to a checkable research record. Plan 6.4 defines STRONG
# evidence as coming from "real research/case" transfer -- these two
# judgments *are* real investment-research judgment calls the owner made,
# but the owner confirmed on review that neither has a locatable
# episode/file artifact behind it, so calling them STRONG conflated "the
# owner's genuine recollection of having applied this" with the higher bar
# plan 6.4 intends STRONG to certify (a checkable record). They are recorded
# here as evidence_level=PARTIAL instead, with reference/note text stating
# plainly that this is unverified personal research recollection, not a
# checkable episode/file. If a real episode ID or artifact path is ever
# located for either, it should be upgraded back to STRONG with that
# citation attached.
applications:
  - concept_slug: kv-cache
    evidence_level: PARTIAL
    reference_type: research_note
    reference: >
      个人投研记忆判断（无正式 episode/文件可核对）：在 co_investor 全球
      capex 筛选工作中，回忆曾用 KV cache 公式估算长鑫存储 (CXMT) 下游
      客户长上下文推理场景的显存瓶颈，用于判断存储扩产需求弹性
      （2026-08 vertical-slice seed note；2026-08-30 audit 后改记为
      PARTIAL，因无可核实的 episode ID 或 artifact 路径）。
    note: >
      个人投研记忆判断，非纯练习题，但目前没有正式 episode/文件可核对
      这次应用的具体时间、输入假设或产出记录。

  - concept_slug: value-capture
    evidence_level: PARTIAL
    reference_type: research_note
    reference: >
      个人投研记忆判断（无正式 episode/文件可核对）：在评估 CXMT IPO
      主题候选标的时，回忆曾用 value creation vs value capture 框架判断
      设备/材料环节相对于晶圆厂本身谁更可能捕获扩产周期的经济利润，
      用于筛选候选标的的护城河来源（2026-08 vertical-slice seed note；
      2026-08-30 audit 后改记为 PARTIAL，因无可核实的 episode ID 或
      artifact 路径）。
    note: >
      个人投研记忆判断，非纯练习题，但目前没有正式 episode/文件可核对
      这次应用的具体时间、输入假设或产出记录。
